[package]
name = "tablica-ofert"
version = "0.1.0"
description = "Tablica Ofert - personal job search board"
authors = ["Szymon Bakonis"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tablica_ofert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher (encrypted SQLite) with OpenSSL built from source - no system OpenSSL needed
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde", "local-offset"] }
# Secrets live in the OS credential store (Windows Credential Manager), never in files
keyring-core = "1.0.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "charset", "http2", "query"] }
tokio = { version = "1.54.1", features = ["time", "macros"] }
imap = "2.4"
native-tls = "0.2.18"
mail-parser = "1.0.1"
tauri-plugin-notification = "2"
sys-locale = "0.3.2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
