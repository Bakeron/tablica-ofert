[package]
name = "tablica-ofert"
version = "0.1.0"
description = "Tablica Ofert - personal job search board"
authors = ["Szymon Bakonis"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tablica_ofert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher (encrypted SQLite) with OpenSSL built from source - no system OpenSSL needed
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde", "local-offset"] }
# Secrets live in the OS credential store (Windows Credential Manager), never in files
keyring-core = "1.0.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "gzip", "charset", "http2", "query", "form"] }
tokio = { version = "1.54.1", features = ["time", "macros"] }
# TLS for IMAP comes from below (native-tls on the PC, rustls on Android) - imap gets a ready stream
imap = { version = "3.0.0-alpha.15", default-features = false }
mail-parser = "1.0.1"
tauri-plugin-notification = "2"
sys-locale = "0.3.2"
tauri-plugin-dialog = "2"
aes-gcm = "0.11.1"
flate2 = "1.1.10"
qrcode = "0.14.1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
# DPAPI for the second copy of the database key (keycopy.rs) - already pulled in by the keyring store
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

# TLS on the PC: the system's own (Schannel on Windows)
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
native-tls = "0.2.18"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
# TLS on Android: rustls with the ring provider and Mozilla's root list (tls.rs) - the bundled
# OpenSSL stays only for the SQLCipher database, never for the network
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
