# The same checks as the pre-commit guard, on a clean Windows machine.
name: Testy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      # Known high and critical vulnerabilities in the JavaScript packages stop the run.
      - name: Package vulnerabilities
        run: npm audit --audit-level=high

      - name: Interface tests
        run: npm test

      - name: Types
        run: npx tsc --noEmit

      # generate_context! in the Rust build needs the built interface to exist.
      - name: Build the interface
        run: npx vite build

      # OpenSSL for SQLCipher is built from source and needs Strawberry Perl, not the one from Git.
      - name: Strawberry Perl and current Rust
        run: |
          if (-not (Test-Path C:\Strawberry\perl\bin\perl.exe)) { choco install strawberryperl -y --no-progress }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup update stable --no-self-update
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
